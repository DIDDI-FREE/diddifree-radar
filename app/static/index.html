<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiddiFree Pilotage</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171c24; --panel2: #1e2530; --line: #2a3342;
    --text: #e6ebf2; --muted: #8b97a8; --accent: #4da3ff;
    --fresh: #2ecc71; --stale: #f1c40f; --unavailable: #e74c3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .4px; }
  header .tag { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--muted); }
  button { background: var(--accent); color: #06121f; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: .6px; border-radius: 4px; padding: 2px 7px; text-transform: uppercase; }
  .badge.fresh { background: rgba(46,204,113,.15); color: var(--fresh); }
  .badge.stale { background: rgba(241,196,15,.15); color: var(--stale); }
  .badge.unavailable { background: rgba(231,76,60,.15); color: var(--unavailable); }
  .metric { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding: 6px 0; }
  .metric .name { color: var(--muted); }
  .metric .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .error-line { color: var(--unavailable); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 26px 0 10px; }
  /* login */
  .login-wrap { max-width: 360px; margin: 10vh auto; }
  .login-wrap .card { padding: 22px; }
  .login-wrap label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
  .login-wrap input { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); padding: 9px 10px; font-size: 14px; }
  .login-wrap button { width: 100%; margin-top: 16px; }
  .notice { font-size: 12px; margin-top: 10px; color: var(--muted); }
  .notice.err { color: var(--unavailable); }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>DiddiFree Pilotage</h1>
  <span class="tag">observer · comprendre · décider</span>
  <span class="spacer"></span>
  <span class="chip" id="session-chip" hidden></span>
  <button class="ghost" id="refresh-btn" hidden>Rafraîchir</button>
  <button class="ghost" id="logout-btn" hidden>Déconnexion</button>
</header>
<main id="app"></main>
<script>
const API = "/api/pilotage";
let session = null;
let refreshTimer = null;

function token() { return sessionStorage.getItem("pilotage_token") || ""; }

async function api(path, options = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
  if (token()) headers["Authorization"] = "Bearer " + token();
  const response = await fetch(API + path, Object.assign({}, options, { headers }));
  if (response.status === 401) { logout(false); throw new Error("Session expirée, reconnectez-vous."); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = body && body.detail && body.detail.error;
    throw new Error((detail && detail.message) || "Requête refusée (" + response.status + ")");
  }
  return body;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "medium" }); } catch { return iso; }
}

function fmtValue(metric) {
  const v = metric.value;
  if (typeof v === "number") {
    const text = v.toLocaleString("fr-FR");
    return metric.unit === "XOF" ? text + " F" : text;
  }
  return esc(v);
}

const BADGES = { fresh: "frais", stale: "obsolète", unavailable: "indisponible" };

function badge(freshness) {
  const status = (freshness && freshness.status) || "unavailable";
  return '<span class="badge ' + status + '">' + (BADGES[status] || status) + "</span>";
}

function moduleCard(block) {
  const summary = block.summary;
  let rows = '<div class="empty">Aucune donnée collectée pour le moment.</div>';
  if (summary && summary.metrics && summary.metrics.length) {
    rows = summary.metrics.map(m =>
      '<div class="metric"><span class="name">' + esc(m.label || m.name) + '</span><span class="value">' + fmtValue(m) + "</span></div>"
    ).join("");
  }
  const links = (summary && summary.deep_links || []).map(l => '<a href="' + esc(l.href) + '">' + esc(l.label) + "</a>").join(" · ");
  const err = block.last_error ? '<div class="error-line">Dernière erreur : ' + esc(block.last_error.code) + "</div>" : "";
  const sync = block.freshness && block.freshness.synchronized_at;
  return '<div class="card">' +
    "<h3>" + esc(block.display_name) + " " + badge(block.freshness) + "</h3>" +
    (summary ? '<div class="meta">Journée du ' + esc(summary.date) + " (" + esc(summary.timezone) + ")</div>" : "") +
    rows + err +
    '<div class="meta">Synchronisé : ' + fmtDate(sync) + (links ? " · " + links : "") + "</div>" +
    "</div>";
}

function sourcesTable(items) {
  const rows = items.map(s =>
    "<tr><td>" + esc(s.display_name) + "</td><td>" + badge(s.freshness) + "</td><td>" + fmtDate(s.last_attempt_at) +
    "</td><td>" + (s.consecutive_failures || 0) + "</td><td>" + (s.last_error ? esc(s.last_error.code) : "—") + "</td></tr>"
  ).join("");
  return "<table><thead><tr><th>Source</th><th>État</th><th>Dernière tentative</th><th>Échecs consécutifs</th><th>Erreur</th></tr></thead><tbody>" + rows + "</tbody></table>";
}

async function renderDashboard() {
  const app = document.getElementById("app");
  try {
    const [overview, sources] = await Promise.all([api("/overview"), api("/sources")]);
    app.innerHTML =
      '<h2>Vue d\'ensemble — ' + esc(overview.date) + '</h2>' +
      '<div class="grid">' + overview.modules.map(moduleCard).join("") + "</div>" +
      "<h2>Sources de collecte</h2>" + sourcesTable(sources.items);
  } catch (error) {
    app.innerHTML = '<div class="card"><div class="error-line">' + esc(error.message) + "</div></div>";
  }
}

function showSession() {
  const chip = document.getElementById("session-chip");
  chip.hidden = !session;
  document.getElementById("logout-btn").hidden = !session;
  document.getElementById("refresh-btn").hidden = !session;
  if (session) chip.textContent = session.user_id.slice(0, 8) + "… · " + session.role;
}

function logout(clear = true) {
  if (clear) sessionStorage.removeItem("pilotage_token");
  sessionStorage.removeItem("pilotage_session");
  session = null;
  if (refreshTimer) clearInterval(refreshTimer);
  showSession();
  renderLogin();
}

function renderLogin(step = "email", email = "", message = "", isError = false) {
  const app = document.getElementById("app");
  const notice = message ? '<div class="notice' + (isError ? " err" : "") + '">' + esc(message) + "</div>" : "";
  if (step === "email") {
    app.innerHTML = '<div class="login-wrap"><div class="card"><h3>Connexion DiddiFreeID</h3>' +
      '<label>Adresse email</label><input id="login-email" type="email" value="' + esc(email) + '" placeholder="prenom@diddifree.com">' +
      '<button id="send-code">Recevoir le code</button>' + notice + "</div></div>";
    document.getElementById("send-code").onclick = async () => {
      const value = document.getElementById("login-email").value.trim();
      if (!value) return renderLogin("email", value, "Saisissez votre adresse email.", true);
      try {
        await api("/auth/otp/request", { method: "POST", body: JSON.stringify({ email: value, channel: "email" }) });
        renderLogin("code", value, "Code envoyé. Vérifiez votre boîte mail.");
      } catch (error) { renderLogin("email", value, error.message, true); }
    };
  } else {
    app.innerHTML = '<div class="login-wrap"><div class="card"><h3>Code de vérification</h3>' +
      '<div class="notice">Envoyé à ' + esc(email) + "</div>" +
      '<label>Code OTP</label><input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">' +
      '<button id="verify-code">Se connecter</button>' +
      '<button class="ghost" id="back-btn" style="margin-top:8px">Changer d\'adresse</button>' + notice + "</div></div>";
    document.getElementById("back-btn").onclick = () => renderLogin("email", email);
    document.getElementById("verify-code").onclick = async () => {
      const code = document.getElementById("login-code").value.trim();
      if (!code) return renderLogin("code", email, "Saisissez le code reçu.", true);
      try {
        const result = await api("/auth/otp/verify", { method: "POST", body: JSON.stringify({ email, code }) });
        sessionStorage.setItem("pilotage_token", result.access_token);
        sessionStorage.setItem("pilotage_session", JSON.stringify(result.session));
        boot();
      } catch (error) { renderLogin("code", email, error.message, true); }
    };
  }
}

function boot() {
  const stored = sessionStorage.getItem("pilotage_session");
  session = token() && stored ? JSON.parse(stored) : null;
  showSession();
  if (!session) return renderLogin();
  renderDashboard();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(renderDashboard, 30000);
}

document.getElementById("logout-btn").onclick = () => logout();
document.getElementById("refresh-btn").onclick = () => renderDashboard();
boot();
</script>
</body>
</html>
