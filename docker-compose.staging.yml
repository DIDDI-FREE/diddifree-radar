x-pilotage-runtime: &pilotage-runtime
  PILOTAGE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  PILOTAGE_ENV: staging
  PILOTAGE_ALLOW_INSECURE_HEADERS: "0"
  PILOTAGE_OIDC_JWKS_URL: ${PILOTAGE_OIDC_JWKS_URL:?PILOTAGE_OIDC_JWKS_URL is required}
  PILOTAGE_OIDC_ISSUER: ${PILOTAGE_OIDC_ISSUER:?PILOTAGE_OIDC_ISSUER is required}
  PILOTAGE_TRUSTED_SERVICE_SUBJECTS: ${PILOTAGE_TRUSTED_SERVICE_SUBJECTS:-}
  PILOTAGE_TRUSTED_SERVICE_MODULES_JSON: ${PILOTAGE_TRUSTED_SERVICE_MODULES_JSON:?PILOTAGE_TRUSTED_SERVICE_MODULES_JSON is required}
  PILOTAGE_CORS_ORIGINS: ${PILOTAGE_CORS_ORIGINS:?PILOTAGE_CORS_ORIGINS is required}
  PILOTAGE_SERVE_FRONTEND: ${PILOTAGE_SERVE_FRONTEND:-0}
  PILOTAGE_BOOTSTRAP_DG_EMAILS: ${PILOTAGE_BOOTSTRAP_DG_EMAILS:-}
  PILOTAGE_MODULES: ${PILOTAGE_MODULES:-identity,diddigo,diddisend,diddipay}
  PILOTAGE_COLLECT_INTERVAL_SECONDS: ${PILOTAGE_COLLECT_INTERVAL_SECONDS:-30}
  PILOTAGE_FRESHNESS_WINDOW_SECONDS: ${PILOTAGE_FRESHNESS_WINDOW_SECONDS:-60}
  PILOTAGE_BREAKDOWN_CONCURRENCY: ${PILOTAGE_BREAKDOWN_CONCURRENCY:-5}
  PILOTAGE_BUSINESS_TIMEZONE: ${PILOTAGE_BUSINESS_TIMEZONE:-Africa/Abidjan}
  PILOTAGE_ALERT_SOURCE_FAILURES_CRITICAL: ${PILOTAGE_ALERT_SOURCE_FAILURES_CRITICAL:-3}
  PILOTAGE_ALERT_ACTIVITY_DROP_PERCENT: ${PILOTAGE_ALERT_ACTIVITY_DROP_PERCENT:-30}
  PILOTAGE_ALERT_CANCELLATION_RATE_PERCENT: ${PILOTAGE_ALERT_CANCELLATION_RATE_PERCENT:-20}
  PILOTAGE_ALERT_FINANCIAL_GAP_XOF: ${PILOTAGE_ALERT_FINANCIAL_GAP_XOF:-1000}
  PILOTAGE_ALERT_OVERDUE_FUNDS_XOF: ${PILOTAGE_ALERT_OVERDUE_FUNDS_XOF:-1}
  PILOTAGE_LOG_LEVEL: ${PILOTAGE_LOG_LEVEL:-INFO}
  PILOTAGE_SERVICE_CLIENT_ID: ${PILOTAGE_SERVICE_CLIENT_ID:-pilotage-staging}
  PILOTAGE_SERVICE_CLIENT_SECRET: ${PILOTAGE_SERVICE_CLIENT_SECRET:-}
  PILOTAGE_IDENTITY_SERVICE_CLIENT_ID: ${PILOTAGE_IDENTITY_SERVICE_CLIENT_ID:-}
  PILOTAGE_IDENTITY_SERVICE_CLIENT_SECRET: ${PILOTAGE_IDENTITY_SERVICE_CLIENT_SECRET:-}
  PILOTAGE_DIDDIGO_SERVICE_CLIENT_ID: ${PILOTAGE_DIDDIGO_SERVICE_CLIENT_ID:-}
  PILOTAGE_DIDDIGO_SERVICE_CLIENT_SECRET: ${PILOTAGE_DIDDIGO_SERVICE_CLIENT_SECRET:-}
  PILOTAGE_DIDDISEND_SERVICE_CLIENT_ID: ${PILOTAGE_DIDDISEND_SERVICE_CLIENT_ID:-}
  PILOTAGE_DIDDISEND_SERVICE_CLIENT_SECRET: ${PILOTAGE_DIDDISEND_SERVICE_CLIENT_SECRET:-}
  PILOTAGE_DIDDIPAY_SERVICE_CLIENT_ID: ${PILOTAGE_DIDDIPAY_SERVICE_CLIENT_ID:-}
  PILOTAGE_DIDDIPAY_SERVICE_CLIENT_SECRET: ${PILOTAGE_DIDDIPAY_SERVICE_CLIENT_SECRET:-}
  PILOTAGE_DIDDIFOOD_SERVICE_CLIENT_ID: ${PILOTAGE_DIDDIFOOD_SERVICE_CLIENT_ID:-}
  PILOTAGE_DIDDIFOOD_SERVICE_CLIENT_SECRET: ${PILOTAGE_DIDDIFOOD_SERVICE_CLIENT_SECRET:-}
  PILOTAGE_DIDDIFILES_SERVICE_CLIENT_ID: ${PILOTAGE_DIDDIFILES_SERVICE_CLIENT_ID:-}
  PILOTAGE_DIDDIFILES_SERVICE_CLIENT_SECRET: ${PILOTAGE_DIDDIFILES_SERVICE_CLIENT_SECRET:-}
  PILOTAGE_IDENTITY_SERVICE_AUDIENCE: ${PILOTAGE_IDENTITY_SERVICE_AUDIENCE:-diddifree-id}
  PILOTAGE_DIDDIGO_SERVICE_AUDIENCE: ${PILOTAGE_DIDDIGO_SERVICE_AUDIENCE:-diddigo}
  PILOTAGE_DIDDISEND_SERVICE_AUDIENCE: ${PILOTAGE_DIDDISEND_SERVICE_AUDIENCE:-diddisend}
  PILOTAGE_DIDDIPAY_SERVICE_AUDIENCE: ${PILOTAGE_DIDDIPAY_SERVICE_AUDIENCE:-diddipay}
  PILOTAGE_IDENTITY_SCOPE: ${PILOTAGE_IDENTITY_SCOPE:-identity:reporting:read}
  PILOTAGE_DIDDIGO_SCOPE: ${PILOTAGE_DIDDIGO_SCOPE:-}
  PILOTAGE_DIDDISEND_SCOPE: ${PILOTAGE_DIDDISEND_SCOPE:-}
  PILOTAGE_DIDDIPAY_SCOPE: ${PILOTAGE_DIDDIPAY_SCOPE:-}
  PILOTAGE_DIDDIMAP_SCOPE: ${PILOTAGE_DIDDIMAP_SCOPE:-}
  PILOTAGE_DIDDIFOOD_SCOPE: ${PILOTAGE_DIDDIFOOD_SCOPE:-}
  PILOTAGE_DIDDIFILES_SCOPE: ${PILOTAGE_DIDDIFILES_SCOPE:-}
  PILOTAGE_IDENTITY_DAILY_SUMMARY_PATH: ${PILOTAGE_IDENTITY_DAILY_SUMMARY_PATH:-/internal/pilotage/identity-summary}
  PILOTAGE_DIDDIGO_DAILY_SUMMARY_PATH: ${PILOTAGE_DIDDIGO_DAILY_SUMMARY_PATH:-}
  PILOTAGE_DIDDISEND_DAILY_SUMMARY_PATH: ${PILOTAGE_DIDDISEND_DAILY_SUMMARY_PATH:-}
  PILOTAGE_DIDDIPAY_DAILY_SUMMARY_PATH: ${PILOTAGE_DIDDIPAY_DAILY_SUMMARY_PATH:-}
  PILOTAGE_DIDDIGO_SUMMARY_BASE: ${PILOTAGE_DIDDIGO_SUMMARY_BASE:-}
  PILOTAGE_DIDDISEND_SUMMARY_BASE: ${PILOTAGE_DIDDISEND_SUMMARY_BASE:-}
  PILOTAGE_DIDDIPAY_SUMMARY_BASE: ${PILOTAGE_DIDDIPAY_SUMMARY_BASE:-}
  PILOTAGE_DIDDIMAP_SUMMARY_BASE: ${PILOTAGE_DIDDIMAP_SUMMARY_BASE:-}
  PILOTAGE_DIDDIFOOD_SUMMARY_BASE: ${PILOTAGE_DIDDIFOOD_SUMMARY_BASE:-}
  PILOTAGE_DIDDIFILES_SUMMARY_BASE: ${PILOTAGE_DIDDIFILES_SUMMARY_BASE:-}
  DIDDIFREEID_SERVICE_URL: ${DIDDIFREEID_SERVICE_URL:-https://auth-staging.diddifree.com/identity/v1}
  DIDDIGO_SERVICE_URL: ${DIDDIGO_SERVICE_URL:-https://go-staging.diddifree.com}
  DIDDISEND_SERVICE_URL: ${DIDDISEND_SERVICE_URL:-https://diddisend-api-staging.diddifree.com}
  DIDDIPAY_SERVICE_URL: ${DIDDIPAY_SERVICE_URL:-https://pay-api-staging.diddifree.com}
  DIDDIMAP_SERVICE_URL: ${DIDDIMAP_SERVICE_URL:-http://abidjanmaps-backend-staging.diddifree.com}
  DIDDIFOOD_SERVICE_URL: ${DIDDIFOOD_SERVICE_URL:-https://diddifood-backend-staging.diddifree.com}
  DIDDIFILES_SERVICE_URL: ${DIDDIFILES_SERVICE_URL:-https://diddifiles.diddifree.com}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pilotage_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${PILOTAGE_HTTP_PORT:-38090}:8000"
    environment:
      <<: *pilotage-runtime
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
    command: ["python", "scripts/run_collector.py"]
    restart: unless-stopped
    environment:
      <<: *pilotage-runtime
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pilotage_postgres:
